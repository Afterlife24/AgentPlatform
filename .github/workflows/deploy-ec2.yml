name: Deploy to EC2

# Deploys to the Mumbai EC2 instance whenever code lands on main via a push
# (i.e. a direct push or a merged PR, not every commit inside an open PR).
#
# Also triggers when the WhatsApp Adapter repo dispatches an event.
#
# Runs on a self-hosted runner installed directly on the target EC2 instance
# (see /home/ubuntu/actions-runner on the box). The runner polls GitHub
# outbound, so no inbound SSH access from GitHub's IP ranges is needed.

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [whatsapp-adapter-updated]

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, develop]
    steps:
      - name: Sync repo and redeploy
        run: |
          set -euo pipefail

          cd /home/ubuntu/dograh
          git fetch origin
          git checkout main
          git reset --hard origin/main

          # Also pull latest WhatsApp Adapter code (sibling repo)
          if [ -d /home/ubuntu/Whatsapp_Adapter ]; then
            cd /home/ubuntu/Whatsapp_Adapter
            git fetch origin
            git reset --hard origin/main
          fi

          cd /home/ubuntu/dograh
          sudo docker compose --profile remote up -d --build

          # nginx resolves upstream container hostnames to Docker-network IPs at
          # startup and caches them. Rebuilt containers get new IPs, so nginx must
          # be restarted to avoid 502s.
          sudo docker compose --profile remote restart nginx

          echo "Deployed $(git rev-parse --short HEAD) on main"
