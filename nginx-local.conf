upstream api_backend {
    server api:8000;
}

upstream ui_frontend {
    server ui:3010;
}

upstream whatsapp_adapter {
    server whatsapp-adapter:8080;
}

upstream whatsapp_dashboard {
    server whatsapp-dashboard:3001;
}

server {
    listen 80;

    # WebSocket signaling - must come before generic /api
    location /api/v1/ws/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Telephony WebSocket (Twilio media streams)
    location /api/v1/telephony/ws/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # WhatsApp adapter endpoints
    location /whatsapp {
        proxy_pass http://whatsapp_adapter;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WhatsApp adapter dashboard/API endpoints
    location /conversations {
        proxy_pass http://whatsapp_adapter;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /messages/ {
        proxy_pass http://whatsapp_adapter;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /takeover {
        proxy_pass http://whatsapp_adapter;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /release {
        proxy_pass http://whatsapp_adapter;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /send-message {
        proxy_pass http://whatsapp_adapter;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /leads {
        proxy_pass http://whatsapp_adapter;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /agents {
        proxy_pass http://whatsapp_adapter;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://whatsapp_adapter;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Operator billing console (Phase 6/8). All adapter routes added for the
    # billing feature live under /adapter/ on purpose: nginx matches the most
    # specific prefix, so this never collides with the AgentX frontend's own
    # /billing customer page (served by the "/" catch-all below). Do NOT add a
    # bare /billing block here — it would silently route customers to the
    # adapter instead of the frontend.
    location /adapter/ {
        proxy_pass http://whatsapp_adapter;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WhatsApp adapter dashboard UI (Next.js app on port 3001)
    # This MUST come before the catch-all "/" location
    location /dashboard/whatsapp {
        proxy_pass http://whatsapp_dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Next.js WebSocket for HMR
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # API requests proxy to backend
    location /api/v1/ {
        proxy_pass http://api_backend;
        # $http_host keeps the port (e.g. localhost:3000) so the API can build
        # correct public URLs (embed snippets); $host would drop it.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Everything else goes to the UI (including /api/config/* which is a Next.js route)
    location / {
        proxy_pass http://ui_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js HMR WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
