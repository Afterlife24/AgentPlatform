# Local-only additions on top of docker-compose.yaml.
#
# Docker Compose auto-loads this file alongside docker-compose.yaml — no -f
# flag needed. Anything here is layered on top of the base file: new services
# are added, and any key that also exists in the base file gets overridden.
#
# WHY THIS FILE EXISTS:
# docker-compose.yaml is a clean mirror of the official Dograh repo (upstream).
# We never edit it directly, so `git fetch upstream && git merge upstream/main`
# stays conflict-free. All Windows/local-only customizations live here instead,
# in a file upstream doesn't know about and will never touch.
#
# This currently adds one thing: an nginx reverse proxy on port 3000 that
# correctly routes both HTTP and WebSocket traffic to the ui/api containers.
# See LOCAL_SETUP.md for why this is needed (WebSockets don't route correctly
# through port 3010 directly).

services:
  # Auto-restart every long-running service after a Docker daemon restart
  # (e.g. `docker compose up` was never re-run manually) or an EC2
  # stop/start cycle. Without this, only `coturn` (set in the upstream base
  # file) comes back on its own — every other container stays "Exited" until
  # someone SSHes in and runs `docker compose --profile remote up -d` by
  # hand. `dograh-init` is intentionally excluded: it's a one-shot config
  # renderer that's supposed to exit 0 after running once: giving it a
  # restart policy would just make it loop forever.
  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  minio:
    user: root
    restart: unless-stopped

  nginx:
    restart: unless-stopped

  nginx-local:
    image: nginx:alpine
    container_name: nginx_local
    restart: unless-stopped
    depends_on:
      ui:
        condition: service_started
      api:
        condition: service_healthy
      whatsapp-adapter:
        condition: service_started
    ports:
      - "3000:80"
    volumes:
      - ./nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network

  # Build the ui image from our fork's source instead of pulling
  # dograhai/dograh-ui:latest (the official upstream prebuilt tag). This is
  # required because we carry a local patch on top of upstream (see
  # ui/src/middleware.ts — exempts /embed from the auth redirect so the
  # public widget script isn't gated behind login). Pulling the prebuilt
  # tag would silently revert that patch on every deploy/restart, since the
  # upstream image has no knowledge of our fork's commits.
  #
  # Any deploy/CI step for this project must use `--build` (not
  # `--pull always`) so this directive actually takes effect, e.g.:
  #   docker compose --profile remote up -d --build
  # Build the api image from source so we get the public_text_chat routes
  # and any other local patches not yet in the upstream prebuilt image.
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: dograh-local/dograh-api:local
    pull_policy: never
    restart: unless-stopped
    # Prepaid credit wallet config (Phases 3–8). The base compose file doesn't
    # pass these through, so inject them here.
    environment:
      # Gmail SMTP for OTP emails (signup verification + forgot password)
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      # Shared secret for the internal credits API. Without it, every
      # /internal/credits route returns 503 ("Internal API is not configured").
      DOGRAH_INTERNAL_SECRET: "${DOGRAH_INTERNAL_SECRET:-}"
      # Local dev: pin the public endpoint so the backend does NOT try to
      # discover a Cloudflare tunnel at runtime. The cloudflared service is
      # behind the "tunnel" profile and isn't running locally, so every call to
      # get_backend_endpoints() (including the UI's /health probe) would block
      # ~5s on http://cloudflared:2000/metrics and blow past the UI's 3000ms
      # health-check timeout — surfacing as "Backend connection failed" in the
      # browser. A hostname value (not localhost / not a bare IP) is treated as
      # publicly reachable by is_local_or_private_url(), so the tunnel lookup is
      # skipped and /health returns immediately. host.docker.internal:3000 is the
      # nginx-local proxy as seen from the host; it's only used to build
      # webhook/embed links, which aren't exercised in local testing.
      BACKEND_API_ENDPOINT: "${BACKEND_API_ENDPOINT:-http://host.docker.internal:3000}"
      # Master switch for refusing runs on an empty/blocked wallet (Phase 5).
      # Defaults to false so the feature deploys and balances seed before any
      # customer is refused — flipping this to true is the go-live moment (8.5).
      ENFORCE_CREDIT_BALANCE: "${ENFORCE_CREDIT_BALANCE:-false}"
      # Balance at or below which a run is refused when enforcement is on.
      MINIMUM_WALLET_BALANCE_USD: "${MINIMUM_WALLET_BALANCE_USD:-0.00}"
    # Mount the local startup script and use it as the entrypoint
    # (adds --proxy-headers to uvicorn for Twilio signature validation behind nginx)
    volumes:
      - ./scripts/start_services_docker_local.sh:/app/scripts/start_services_docker_local.sh:ro
      - ./api:/app/api
    command: ["./scripts/start_services_docker_local.sh"]

  # Same image for the ARQ worker (built once, reused)
  arq-worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: dograh-local/dograh-api:local
    pull_policy: never
    restart: unless-stopped
    volumes:
      - ./api:/app/api
    environment:
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      # Same as api: skip runtime Cloudflare-tunnel discovery for local dev.
      BACKEND_API_ENDPOINT: "${BACKEND_API_ENDPOINT:-http://host.docker.internal:3000}"

  # NEXT_PUBLIC_BACKEND_URL is baked into the Next.js build at build time (it's
  # a NEXT_PUBLIC_ var, inlined into the browser JS bundle) — it can't be
  # swapped at runtime like a normal env var. Defaults to the local nginx-local
  # proxy (port 3000) for Windows/local dev, but MUST be overridden to the
  # real public URL for any remote deployment (set NEXT_PUBLIC_BACKEND_URL in
  # .env to https://<your-domain-or-sslip-host>), or every browser API call
  # silently targets a nonexistent localhost:3000 on the server and login/
  # signup appears to work but never actually authenticates (401s on every
  # subsequent call, e.g. /workflow/fetch).
  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3000}
      # Cap build-time memory so the Next.js compile doesn't OOM
      shm_size: "256m"
    image: dograh-local/dograh-ui:local
    pull_policy: never
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g
    environment:
      NEXT_PUBLIC_BACKEND_URL: "${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3000}"
    volumes:
      - ./ui/public/embed:/app/public/embed:ro

  # WhatsApp adapter — Twilio WhatsApp webhooks routed via nginx at /whatsapp
  #
  # NOTE: context path casing must match the actual sibling folder name
  # exactly (../Whatsapp_Adapter). Windows filesystems are case-insensitive
  # so "../whatsapp_adapter" resolves fine locally, but this stack also runs
  # on Linux EC2 in production, where the filesystem IS case-sensitive and a
  # mismatched path fails the build outright ("path not found").
  whatsapp-adapter:
    build:
      context: ../Whatsapp_Adapter
      dockerfile: Dockerfile
    container_name: whatsapp_adapter
    restart: unless-stopped
    environment:
      # Inside Docker, the Dograh API is reachable at http://api:8000
      DOGRAH_API_BASE: "http://api:8000/api/v1"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN}"
      TWILIO_WHATSAPP_NUMBER: "${TWILIO_WHATSAPP_NUMBER}"
      # PostgreSQL — same database as AgentX (single source of truth)
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres"
      # AGENT_MAPPINGS used only for one-time migration to PostgreSQL on first deploy.
      # After migration, all agent config is managed via the dashboard.
      AGENT_MAPPINGS: "${WHATSAPP_AGENT_MAPPINGS:-}"
      # Phase 1: Authentication
      ADAPTER_ADMIN_PASSWORD: "${ADAPTER_ADMIN_PASSWORD}"
      ADAPTER_SESSION_SECRET: "${ADAPTER_SESSION_SECRET}"
      DASHBOARD_ORIGIN: "http://localhost:3001"
      # CORS — comma-separated list of allowed origins
      ADAPTER_CORS_ORIGINS: "${ADAPTER_CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3010}"
      # Mark the session cookie Secure when served over HTTPS (production).
      ADAPTER_COOKIE_SECURE: "${ADAPTER_COOKIE_SECURE:-}"
      # Phase 6: operator billing console → AgentX internal credits API.
      # The adapter forwards this secret to AgentX; it is NEVER sent to the
      # dashboard (browser) service. Formal compose wiring is Phase 8, added
      # here so the grant flow is testable. http://api:8000 is internal DNS.
      AGENTX_INTERNAL_BASE: "http://api:8000/api/v1"
      DOGRAH_INTERNAL_SECRET: "${DOGRAH_INTERNAL_SECRET:-}"
    ports:
      # Expose adapter directly so the dashboard (browser) can reach it
      - "8001:8080"
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # WhatsApp dashboard — Next.js UI for managing agents, conversations, leads
  whatsapp-dashboard:
    build:
      context: ../Whatsapp_Adapter/dashboard
      dockerfile: Dockerfile
      args:
        # Baked into rewrites() at build time so the server-side proxy
        # targets the adapter container, not localhost.
        ADAPTER_INTERNAL_URL: "http://whatsapp_adapter:8080"
        # Phase 6: default INR→USD rate pre-filled in the billing console.
        # Inlined into the browser bundle at build time; public, not a secret.
        NEXT_PUBLIC_DEFAULT_USD_INR_RATE: "${DEFAULT_USD_INR_RATE:-0.0112}"
    container_name: whatsapp_dashboard
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_ADAPTER_URL: "${WHATSAPP_DASHBOARD_ADAPTER_URL:-http://localhost:8001}"
    ports:
      - "3001:3001"
    depends_on:
      - whatsapp-adapter
    networks:
      - app-network

  # agentX Consultancy — Vite/React static site served on port 3002
  agentx-consultancy:
    build:
      context: ../agentX_consultancy
      dockerfile: Dockerfile
    container_name: agentx_consultancy
    restart: unless-stopped
    ports:
      - "3002:80"
    networks:
      - app-network
